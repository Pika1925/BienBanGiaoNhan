
name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Windows EXE
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name BienBanGiamDinh --add-data "template_190.docx;." --add-data "template_191.docx;." --collect-all docx app.py

      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist/BienBanGiamDinh.exe")) {
            throw "EXE not found"
          }
          Get-Item "dist/BienBanGiamDinh.exe"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: BienBanGiamDinh-Windows-x64
          path: dist/BienBanGiamDinh.exe
