name: Build BienBanGiaoNhan V5
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Compile check
        run: python -m py_compile app.py
      - name: Build GUI executable
        shell: cmd
        run: pyinstaller --clean --noconfirm --onefile --windowed --name BienBanGiaoNhan --add-data "template_190.docx;." --add-data "template_191.docx;." --collect-all docx app.py
      - name: Build diagnostic executable
        shell: cmd
        run: pyinstaller --clean --noconfirm --onefile --console --name BienBanGiaoNhan_DEBUG --add-data "template_190.docx;." --add-data "template_191.docx;." --collect-all docx app.py
      - name: Verify outputs
        shell: pwsh
        run: |
          if (!(Test-Path dist/BienBanGiaoNhan.exe)) { throw 'Missing GUI EXE' }
          if (!(Test-Path dist/BienBanGiaoNhan_DEBUG.exe)) { throw 'Missing debug EXE' }
      - uses: actions/upload-artifact@v4
        with:
          name: BienBanGiaoNhan-V5-Windows
          path: |
            dist/BienBanGiaoNhan.exe
            dist/BienBanGiaoNhan_DEBUG.exe
